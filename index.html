<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halation & Bloom Filter</title>
    <link rel="stylesheet" href="style.css">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Halation<span class="highlight">Filter</span></h1>
            <p>Premium Analog Light Effects</p>
        </header>

        <main>
            <div class="controls-panel">
                <div class="upload-section">
                    <label for="image-upload" class="upload-btn">
                        <span class="icon">📁</span> Upload Image
                    </label>
                    <input type="file" id="image-upload" accept="image/*">
                </div>

                <div class="settings-group">
                    <h3>Halation</h3>
                    <div class="control-item">
                        <label>Strength <span id="val-halation_strength">1.3</span></label>
                        <input type="range" id="halation_strength" min="0" max="3.0" step="0.1" value="1.3">
                    </div>
                    <div class="control-item">
                        <label>Radius <span id="val-halation_blur_radius">60</span></label>
                        <input type="range" id="halation_blur_radius" min="10" max="200" step="5" value="60">
                    </div>
                    <div class="control-item">
                        <label>Threshold <span id="val-halation_threshold">0.75</span></label>
                        <input type="range" id="halation_threshold" min="0" max="1.0" step="0.05" value="0.75">
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Golden Bloom</h3>
                    <div class="control-item">
                        <label>Lumen (Tint)</label>
                        <input type="color" id="bloom_tint_color" value="#ffd799"
                            style="width: 100%; height: 40px; cursor: pointer;">
                    </div>
                    <div class="control-item">
                        <label>Strength <span id="val-bloom_strength">0.8</span></label>
                        <input type="range" id="bloom_strength" min="0" max="2.0" step="0.1" value="0.8">
                    </div>
                    <div class="control-item">
                        <label>Radius <span id="val-bloom_radius">120</span></label>
                        <input type="range" id="bloom_radius" min="10" max="300" step="10" value="120">
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Effects</h3>
                    <div class="control-item">
                        <label>Streak Mode</label>
                        <select id="streak_mode"
                            style="width: 100%; padding: 8px; border-radius: 4px; background: #333; color: white; border: none;">
                            <option value="horizontal">Horizontal</option>
                            <option value="vertical">Vertical</option>
                            <option value="cross">Cross (+)</option>
                            <option value="omni">Omni (Star)</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label>Streaks <span id="val-streak_strength">0.35</span></label>
                        <input type="range" id="streak_strength" min="0" max="2.0" step="0.05" value="0.35">
                    </div>
                    <div class="control-item">
                        <label>Grain <span id="val-grain_amount">0.012</span></label>
                        <input type="range" id="grain_amount" min="0" max="0.1" step="0.001" value="0.012">
                    </div>
                    <div class="control-item">
                        <label>Aberration <span id="val-aberration_amount">0.001</span></label>
                        <input type="range" id="aberration_amount" min="0" max="0.02" step="0.001" value="0.001">
                    </div>
                </div>

                <button id="process-btn" class="primary-btn">Apply Effects</button>
            </div>

            <div class="preview-panel">
                <div id="image-container" class="empty-state">
                    <p>No image uploaded</p>
                    <img id="source-img" style="display:none;">
                    <img id="result-img" style="display:none;">
                    <div id="loading" class="loader" style="display:none;">Processing...</div>
                </div>
                <div class="actions">
                    <button id="download-btn" class="secondary-btn" disabled>Download Result</button>
                </div>
            </div>
        </main>
    </div>

    <!-- PyScript Logic -->
    <py-config>
        packages = ["numpy", "pillow"]
    </py-config>

    <script type="py" src="./main.py?v=4"></script>

    <!-- JS Helper -->
    <script>
        // Simple slider value update
        document.querySelectorAll('input[type="range"]').forEach(input => {
            input.addEventListener('input', (e) => {
                document.getElementById('val-' + e.target.id).textContent = e.target.value;
            });
        });
    </script>
</body>

</html>
