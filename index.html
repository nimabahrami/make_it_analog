<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halation & Bloom Filter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Halation<span class="highlight">Filter</span></h1>
            <p>Premium Analog Light Effects · Live Preview</p>
        </header>

        <main>
            <div class="controls-panel">
                <div class="upload-section">
                    <label for="image-upload" class="upload-btn">
                        <span class="icon">📁</span> Upload Image
                    </label>
                    <input type="file" id="image-upload" accept="image/*">
                </div>

                <div class="settings-group">
                    <h3>Halation</h3>
                    <div class="control-item">
                        <label>Strength <span id="val-halation_strength">1.3</span></label>
                        <input type="range" id="halation_strength" min="0" max="3.0" step="0.1" value="1.3" data-default="1.3">
                    </div>
                    <div class="control-item">
                        <label>Radius <span id="val-halation_blur_radius">60</span></label>
                        <input type="range" id="halation_blur_radius" min="10" max="200" step="5" value="60" data-default="60">
                    </div>
                    <div class="control-item">
                        <label>Threshold <span id="val-halation_threshold">0.75</span></label>
                        <input type="range" id="halation_threshold" min="0" max="1.0" step="0.05" value="0.75" data-default="0.75">
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Golden Bloom</h3>
                    <div class="control-item">
                        <label>Lumen (Tint)</label>
                        <input type="color" id="bloom_tint_color" value="#ffd799"
                            style="width: 100%; height: 40px; cursor: pointer;">
                    </div>
                    <div class="control-item">
                        <label>Strength <span id="val-bloom_strength">0.8</span></label>
                        <input type="range" id="bloom_strength" min="0" max="2.0" step="0.1" value="0.8" data-default="0.8">
                    </div>
                    <div class="control-item">
                        <label>Radius <span id="val-bloom_radius">120</span></label>
                        <input type="range" id="bloom_radius" min="10" max="300" step="10" value="120" data-default="120">
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Light Leaks</h3>
                    <div class="control-item">
                        <label>Color</label>
                        <input type="color" id="leak_color" value="#ff6a2a"
                            style="width: 100%; height: 40px; cursor: pointer;">
                    </div>
                    <div class="control-item">
                        <label>Strength <span id="val-leak_strength">0.0</span></label>
                        <input type="range" id="leak_strength" min="0" max="1.0" step="0.02" value="0.0" data-default="0.0">
                    </div>
                    <div class="control-item">
                        <label>Position <span id="val-leak_position">0.12</span></label>
                        <input type="range" id="leak_position" min="0" max="1.0" step="0.01" value="0.12" data-default="0.12">
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Effects</h3>
                    <div class="control-item">
                        <label>Streak Mode</label>
                        <select id="streak_mode">
                            <option value="horizontal">Horizontal</option>
                            <option value="vertical">Vertical</option>
                            <option value="cross">Cross (+)</option>
                            <option value="omni">Omni (Star)</option>
                        </select>
                    </div>
                    <div class="control-item">
                        <label>Streaks <span id="val-streak_strength">0.35</span></label>
                        <input type="range" id="streak_strength" min="0" max="2.0" step="0.05" value="0.35" data-default="0.35">
                    </div>
                    <div class="control-item">
                        <label>Chromatic Aberration <span id="val-aberration_amount">0.15</span></label>
                        <input type="range" id="aberration_amount" min="0" max="1.0" step="0.01" value="0.15" data-default="0.15">
                    </div>
                    <div class="control-item">
                        <label>Grain <span id="val-grain_amount">0.15</span></label>
                        <input type="range" id="grain_amount" min="0" max="1.0" step="0.01" value="0.15" data-default="0.15">
                    </div>
                    <div class="control-item">
                        <label>Fade <span id="val-fade_amount">0.0</span></label>
                        <input type="range" id="fade_amount" min="0" max="1.0" step="0.05" value="0.0" data-default="0.0">
                    </div>
                    <div class="control-item">
                        <label>Mute <span id="val-mute_amount">0.0</span></label>
                        <input type="range" id="mute_amount" min="0" max="1.0" step="0.05" value="0.0" data-default="0.0">
                    </div>
                </div>

                <div class="settings-group">
                    <h3>Tone Curve</h3>
                    <div class="control-item">
                        <label>Shadows <span id="val-shadows">0.0</span></label>
                        <input type="range" id="shadows" min="-1.0" max="1.0" step="0.1" value="0.0" data-default="0.0">
                    </div>
                    <div class="control-item">
                        <label>Midtones <span id="val-midtones">0.0</span></label>
                        <input type="range" id="midtones" min="-1.0" max="1.0" step="0.1" value="0.0" data-default="0.0">
                    </div>
                    <div class="control-item">
                        <label>Highlights <span id="val-highlights">0.0</span></label>
                        <input type="range" id="highlights" min="-1.0" max="1.0" step="0.1" value="0.0" data-default="0.0">
                    </div>
                </div>

                <button id="reset-btn" class="primary-btn">Reset Effects</button>
            </div>

            <div class="preview-panel">
                <div id="image-container" class="empty-state">
                    <p id="placeholder">No image uploaded</p>
                    <canvas id="gl-canvas" style="display:none;"></canvas>
                </div>
                <div class="actions">
                    <button id="download-btn" class="secondary-btn" disabled>Download Result</button>
                </div>

                <div id="error-notification"
                    style="display:none; margin-top: 20px; padding: 15px; background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; border-radius: 8px; color: #ff6666;">
                    <strong>⚠️ Error:</strong> <span id="error-message"></span>
                </div>
            </div>
        </main>
    </div>

    <script src="./app.js?v=1"></script>
</body>

</html>
